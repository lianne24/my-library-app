spring.application.name=com.rest.webservices.restfulwebservices

logging.level.org.springframework=info

# JPA & Database Configuration

# JDBC URL
spring.datasource.url=jdbc:mysql://localhost:3306/books

# Database username and password
spring.datasource.username=books-user
spring.datasource.password=bookspassword

# Hibernate dialect defines SQL 
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Hibernate updates schema without dropping existing data
spring.jpa.hibernate.ddl-auto=update